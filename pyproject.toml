[project]
name = "optitune"
version = "0.3.0"
description = "Professional Linux piano tuning workstation — one-click GUI, selectable audio input, live strobe + cents, test-driven with synthetic inharmonic tones."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "OptiTune Contributors" },
]
keywords = ["piano", "tuner", "audio", "dsp", "PySide6", "music", "intonation", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]

dependencies = [
    "PySide6>=6.7,<6.10",
    "pyqtgraph>=0.13.7",
    "sounddevice>=0.5.1",
    "numpy>=2.1,<3",
    "scipy>=1.14",
    "numba>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "pyfftw>=0.15; platform_system != 'Windows'",
    "soundfile>=0.12",
]

[project.scripts]
optitune = "optitune.__main__:main"

[project.urls]
Homepage = "https://github.com/z3n/optitune"
Repository = "https://github.com/z3n/optitune"
Issues = "https://github.com/z3n/optitune/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optitune"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "pyfftw>=0.15; platform_system != 'Windows'",
    "soundfile>=0.12",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "real_piano: tests that require actual piano + microphone hardware (excluded from CI)",
    "synth_only: fast synthetic-tone-only tests (safe for CI)",
]
qt_api = "pyside6"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]  # line length handled by formatter; B008 for Qt signal patterns

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
strict_optional = true
show_error_codes = true
disable_error_code = ["attr-defined"]  # PySide6 / Qt enum stubs are incomplete
exclude = [
    "tests/",
    "build/",
]
